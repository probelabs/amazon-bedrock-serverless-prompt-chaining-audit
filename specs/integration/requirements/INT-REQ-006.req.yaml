id: INT-REQ-006
version: 1
status: review
priority: shall
category: interface
req_type: guarantee
fretish: the s3_pdf shall always satisfy (!pdf_upload_requested | object_stored_in_pdf_bucket) & (expires_in >= 60) & (expires_in <= 900) & (!pdf_upload_requested | presigned_get_url_returned)
description: The PDF interface shall store the itinerary object in PDF_BUCKET and return a presigned GET URL with expires_in in 60-900 seconds.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-008
component: s3_pdf
rationale: The TripPlanner bucket is private with a short lifecycle. generate_presigned_url uses ExpiresIn=900. A zero-second window is not a usable download. The spec lower bound is 60 seconds. Itinerary markdown is untrusted and is passed to md2pdf/WeasyPrint (KI-pdf-md2pdf-ssti, KI-pdf-weasyprint-ssrf). This requirement does not claim sanitization or a deny URL fetcher.
