id: SW-REQ-007
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: the pdf_creator shall always satisfy (!itinerary_ready | presigned_pdf_url_returned) & (expires_in >= 60) & (expires_in <= 900) & (!itinerary_ready | object_stored_in_pdf_bucket) & (!itinerary_ready | content_type_is_pdf) & (!itinerary_ready | temp_pdf_unlinked) & (!untrusted_itinerary_present | !template_eval_active)
description: The PDF creator shall upload the itinerary PDF to PDF_BUCKET with ContentType application/pdf, unlink the temporary file, and return a presigned GET URL with expires_in in 60-900 seconds. The handler shall not evaluate a Jinja template when untrusted itinerary markdown is present.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-008
component: pdf_creator
rationale: TripPlanner presents a downloadable itinerary. generate_presigned_url uses ExpiresIn=900. A zero-second window is not a usable download. The spec lower bound is 60 seconds. Itinerary markdown is untrusted user location plus model text. Code passes it to md2pdf/WeasyPrint (KI-pdf-md2pdf-ssti, KI-pdf-weasyprint-ssrf). This requirement forbids template evaluation of that markdown. It does not claim a deny URL fetcher.
tags: []
variables:
    - itinerary_ready
    - presigned_pdf_url_returned
    - expires_in
    - object_stored_in_pdf_bucket
    - content_type_is_pdf
    - temp_pdf_unlinked
    - untrusted_itinerary_present
    - template_eval_active
