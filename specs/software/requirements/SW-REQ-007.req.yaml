obligation_hazards:
    - class: boundary
      worst_case: expires_in below 60 seconds expires before the user can open the download link.
      severity: low
    - class: error_handling
      worst_case: upload_file or presign fails after unlink so the user gets no itinerary URL.
      severity: medium
    - class: malformed_input
      worst_case: Itinerary markdown is converted without a location so the PDF is generated from an empty title.
      severity: medium
    - class: nominal
      worst_case: A ready itinerary is not uploaded so no presigned GET URL is returned.
      severity: low
    - class: silent_false_safety_reviewed
      worst_case: Software-layer domain mutex plus MC/DC both-true ignore advertised the SSTI row as unreachable while the live handler still passes untrusted markdown to md2pdf raw.
      severity: high
    - class: source_fragment_validated_before_composition
      worst_case: Handler interpolates event location and itinerary into markdown and calls md2pdf(..., raw=), so unsandboxed Jinja evaluates attacker-controlled expressions in the PDF Lambda (KI-pdf-md2pdf-ssti).
      severity: high
