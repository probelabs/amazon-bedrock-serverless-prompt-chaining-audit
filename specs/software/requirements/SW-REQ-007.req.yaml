      reason: SW-REQ-007 forbids Jinja evaluation of untrusted itinerary markdown. It does not claim a WeasyPrint deny URL fetcher. Markdown-image SSRF stays on KI-pdf-weasyprint-ssrf.
      suppressed_by: agent:grok
      suppressed_at: "2026-08-14T10:49:51Z"
      framework_refs:
        - CWE CWE-918,CWE-441
