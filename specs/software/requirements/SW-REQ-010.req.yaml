fretish: the invoke_chain_builder shall always satisfy (!(initial_assistant_text_set & pass_conversation_set) | builder_raises) & (!conflicting_prompt_options | builder_raises) & (max_tokens_to_sample > 0) & (!include_previous_conversation_in_prompt | flatten_messages)
