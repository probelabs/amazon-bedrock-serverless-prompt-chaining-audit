rationale: MoviePitch and HumanInput continue only after send_task_success. The UI detects the pause from the latest history event. Intended pitch_choice is exact 1, 2, or 3. Code uses string_matches N* (KI-moviepitch-pitch-glob-1star). poll uses time.sleep(1). user_choice is yes or no.
