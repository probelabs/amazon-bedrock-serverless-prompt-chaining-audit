id: SW-REQ-006
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: the github_repo_lookup shall always satisfy (!extracted_url_is_invalid | lookup_rejects_url) & (!url_matches_https_github_owner_repo | lookup_rejects_url) & (!example_repo_url | lookup_rejects_url) & (readme_len <= 5000 | readme_truncated) & (status_code = 200 | trending_fetch_raises) & (extract_attempt_count < 3 | repo_url_extracted | lookup_rejects_url) & (requests_timeout_s >= 1) & (requests_timeout_s <= 30) & (url_is_full_github_repo | lookup_rejects_url)
description: The repository lookup shall reject a URL that is not a full https GitHub owner/repo URL or that matches the documented example. A README longer than 5000 characters shall be truncated. A trending GET whose status_code is not 200 shall raise. extract_attempt_count shall stay below 3 unless a real URL is extracted. requests_timeout_s shall stay in 1-30.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: SYS-REQ-007
component: github_repo_lookup
rationale: Bedrock Agents and Strands agents scrape trending pages. Intended URL contract is fullmatch ^https://github.com/[^/]+/[^/]+$. Code uses unanchored re.match and re.search (KI-github-url-unanchored-match), so this is not SSRF protection. requests.get currently has no timeout (KI-github-trending-no-timeout); the spec bound that SHALL hold is 1-30 seconds. README fetch uses a GitHub PAT with no repo allowlist (KI-github-bedrock-readme-pat-no-allowlist, KI-github-strands-readme-pat-no-allowlist). Bedrock grant_invoke SourceArn is agent/* (KI-bedrock-agent-invoke-wildcard). This requirement does not claim PAT allowlist or pinned agent invoke. extract_attempt_count < 3 is the Bedrock range(3) loop. README length uses readme_len <= 5000.
