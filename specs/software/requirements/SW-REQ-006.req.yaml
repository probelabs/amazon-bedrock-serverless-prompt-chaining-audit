obligation_hazards:
    - class: boundary
      worst_case: requests.get with no timeout hangs the lookup, or an unanchored URL regex accepts a non-full GitHub path.
      severity: medium
    - class: error_handling
      worst_case: A non-200 trending GET is ignored so the agent continues with an empty or error HTML body.
      severity: medium
    - class: malformed_input
      worst_case: An example github.com/orgname/reponame URL is accepted as a real repository.
      severity: medium
    - class: nominal
      worst_case: A valid owner/repo URL is rejected so the trending lookup never returns a repository.
      severity: low
    - class: request_timeout_bounded
      worst_case: requests.get to github.com/trending has no timeout so a stalled origin pins the Bedrock-actions or Strands Lambda until the runtime limit (KI-github-trending-no-timeout).
      severity: medium
    - class: security_decision_matches_enforcement_identity
      worst_case: Unanchored re.search/re.match accepts a github.com/owner/repo substring inside another URL, then prefix-strip uses that derived name for Github.get_repo (KI-github-url-unanchored-match).
      severity: medium
