id: SYS-REQ-008
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: the pdf_creator shall always satisfy (!itinerary_ready | presigned_pdf_url_returned) & (expires_in >= 60) & (expires_in <= 900) & (!untrusted_itinerary_present | !template_eval_active)
description: When an itinerary is ready, the system shall return a presigned PDF URL with expires_in in 60-900 seconds. The system shall not evaluate a Jinja template when untrusted itinerary markdown is present.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: STK-REQ-001
component: pdf_creator
rationale: 'TripPlanner presents a downloadable itinerary from a private bucket. generate_presigned_url uses ExpiresIn=900. A zero-second window is not a usable download. Itinerary markdown is untrusted user location plus model text. Code passes it to md2pdf/WeasyPrint (KI-pdf-md2pdf-ssti, KI-pdf-weasyprint-ssrf). This requirement forbids template evaluation of that markdown. It does not claim a deny URL fetcher. Satisfying children: SW-REQ-007 INT-REQ-006.'
