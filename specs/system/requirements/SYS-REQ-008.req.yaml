      severity: low
    - class: error_handling
      worst_case: A ready itinerary returns no presigned URL so the user cannot download the PDF.
      severity: medium
    - class: silent_false_safety_reviewed
      worst_case: Domain mutex and MC/DC defensive ignore mark untrusted+template as unreachable while md2pdf(..., raw=) still evaluates Jinja, so auditors treat the SSTI shall-not as preserved.
      severity: high
    - class: source_fragment_validated_before_composition
      worst_case: Untrusted location or itinerary markdown is interpolated into an f-string and passed to md2pdf raw, so unsandboxed Jinja evaluates attacker-controlled template expressions inside the PDF Lambda (KI-pdf-md2pdf-ssti).
      severity: high
