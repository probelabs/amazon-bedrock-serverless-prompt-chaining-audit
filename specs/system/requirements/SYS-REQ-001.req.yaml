obligation_hazards:
    - class: boundary
      worst_case: An unbounded location, story, or ingredients string is sent into Bedrock prompts and can exhaust the execution.
      severity: medium
    - class: error_handling
      worst_case: A failed StartExecution or poll error leaves the Streamlit user with no terminal status and a stuck spinner.
      severity: medium
    - class: nominal
      worst_case: A started demo never reaches a recognized terminal status so the user never sees a result or typed error.
      severity: low
