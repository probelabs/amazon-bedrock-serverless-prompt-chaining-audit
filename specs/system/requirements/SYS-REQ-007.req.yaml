id: SYS-REQ-007
version: 1
status: review
priority: shall
category: functional
req_type: guarantee
fretish: the github_repo_lookup shall always satisfy (!extracted_url_is_invalid | lookup_rejects_url) & (readme_len <= 5000 | readme_truncated) & (status_code = 200 | trending_fetch_raises) & (requests_timeout_s >= 1) & (requests_timeout_s <= 30) & (url_is_full_github_repo | lookup_rejects_url)
description: The repository lookup shall reject a URL that is not a full https GitHub owner/repo URL. The lookup shall truncate README text over 5000 characters. A trending GET whose status_code is not 200 shall raise. requests_timeout_s shall stay in 1-30.
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: STK-REQ-001
component: github_repo_lookup
rationale: 'MostPopularRepo agents scrape trending pages. Intended URL contract is fullmatch ^https://github.com/[^/]+/[^/]+$. Code regex is unanchored (KI-github-url-unanchored-match), so SSRF protection is not claimed. requests.get currently has no timeout (KI-github-trending-no-timeout). README fetch uses a GitHub PAT with no repo allowlist (KI-github-bedrock-readme-pat-no-allowlist, KI-github-strands-readme-pat-no-allowlist). Bedrock grant_invoke SourceArn is agent/* (KI-bedrock-agent-invoke-wildcard). This requirement does not claim PAT allowlist or pinned agent invoke. Satisfying children: INT-REQ-004 SW-REQ-006.'
