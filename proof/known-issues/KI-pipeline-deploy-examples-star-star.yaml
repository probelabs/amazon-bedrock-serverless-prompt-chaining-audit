id: KI-pipeline-deploy-examples-star-star
title: DeployExamples CodeBuild role grants actions=* on resources=*
description: pipeline/pipeline_stack.py:167-169 attaches iam.PolicyStatement(actions=["*"], resources=["*"]) to the DeployExamples CodeBuild project (construct id DeployExamples; supporting wiring pipeline/pipeline_stack.py:150-169). The same project runs cdk deploy --all --require-approval=never. Compromise of pipeline source or CodeBuild execution yields account-admin equivalent privileges. Codex finding-1 (report.md#finding-1).
affected_requirements:
    - SYS-REQ-006
    - SYS-REQ-011
commands:
    - python3 -m pytest --rootdir=/workspace /workspace/tests/test_pipeline_deploy_iam.py::test_deploy_examples_role_has_no_star_star_policy -q
evidence_manifests:
    - proof/evidence/KI-pipeline-deploy-examples-star-star.yaml
severity: high
severity_basis: reproducer
risk: security
cve_surface: possible
cvss: CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:C/C:H/I:H/A:H
affected_api: pipeline_stack.py add_to_role_policy (pipeline/pipeline_stack.py:167-169)
attacker_input: Compromised pipeline source artifact or CodeStar-connected branch executed by DeployExamples CodeBuild (not anonymous webapp users)
sanitizer: manual:iam-star-star
reproducer_command: python3 -m pytest --rootdir=/workspace /workspace/tests/test_pipeline_deploy_iam.py::test_deploy_examples_role_has_no_star_star_policy -q
tripwire_mutation: Remove DeployExamples PolicyStatement(actions=["*"], resources=["*"]) and scope the CodeBuild role.
reproduction_steps:
    - Read proof/evidence/codex-security-CPeyWd/report.md#finding-1 and pipeline/pipeline_stack.py:167-169.
    - Run python3 -m pytest --rootdir=/workspace /workspace/tests/test_pipeline_deploy_iam.py::test_deploy_examples_role_has_no_star_star_policy -q
    - The Reproduces test asserts DeployExamples has no PolicyStatement(actions=['*'], resources=['*']). It fails (xfail) while the star-star grant remains.
environment_note: No live AWS deployment, Bedrock invocation, or WeasyPrint native runtime in this host. Unit Reproduces tests assert the correct control and xfail while the defect remains.
introduced_in: inception
defect_class: latent
disclosure: public
minimization_status: minimized
mitigation: Do not deploy the pipeline stack, or attach an IAM permissions boundary that forbids Action=* Resource=* on the DeployExamples CodeBuild role. No live AWS in this environment.
remediation: Replace Action=* Resource=* with least-privilege permissions required for the specific CDK deployments (CloudFormation, targeted service APIs, scoped IAM PassRole), and attach a permissions boundary that forbids unrestricted admin.
dedup_armor: >
    Distinct from KI-pipeline-deploy-demo-star-star: independent CodeBuild
    project DeployExamples (pipeline_stack.py:150-169) with its own service role
    and techniques --all deploy principal. Merging would hide a second
    account-admin equivalent identity.
notes:
    - Classification is public because the defect is in the published aws-samples tree.
    - evidence path proof/evidence/codex-security-CPeyWd/report.md#finding-1
customer_impact: A compromised pipeline source or CodeBuild execution can administer the entire AWS account via the DeployExamples deploy role.
