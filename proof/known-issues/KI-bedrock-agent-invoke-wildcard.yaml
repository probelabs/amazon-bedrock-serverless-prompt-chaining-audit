id: KI-bedrock-agent-invoke-wildcard
title: GitHub actions Lambda grant_invoke trusts any Bedrock agent/* in the account
description: |-
    stacks/most_popular_repo_bedrock_agent_stack.py:63-72 grant_invoke's Bedrock principal with ArnLike aws:SourceArn arn:aws:bedrock:{region}:{account}:agent/* rather than this agent's ARN. Any Bedrock agent in the account can invoke PromptChainDemo-MostPopularRepoBedrockAgents-GitHubActions (PAT-backed README/trending tools). ADHD notes: proof/evidence/adhd-threat-spec-red.md (GitHub agent / trending cluster; account-scoped confused deputy).
    Quote:
            bedrock_principal = iam.ServicePrincipal(
                "bedrock.amazonaws.com",
                conditions={
                    "StringEquals": {"aws:SourceAccount": self.account},
                    "ArnLike": {
                        "aws:SourceArn": f"arn:aws:bedrock:{self.region}:{self.account}:agent/*"
                    },
                },
            )
            github_agent_actions_lambda.grant_invoke(bedrock_principal)
affected_requirements:
    - SYS-REQ-007
    - SW-REQ-006
commands:
    - python3 -m pytest --rootdir=/workspace /workspace/tests/test_bedrock_agent_iam.py::test_github_actions_invoke_source_arn_is_pinned_to_this_agent -q
evidence_manifests:
    - proof/evidence/KI-bedrock-agent-invoke-wildcard.yaml
severity: medium
severity_basis: reproducer
risk: security
cve_surface: possible
affected_api: grant_invoke (stacks/most_popular_repo_bedrock_agent_stack.py:63-72)
attacker_input: Any Bedrock agent in the same account (confused deputy) invoking the GitHub actions Lambda; not anonymous webapp users
sanitizer: manual:iam-agent-wildcard
reproducer_command: python3 -m pytest --rootdir=/workspace /workspace/tests/test_bedrock_agent_iam.py::test_github_actions_invoke_source_arn_is_pinned_to_this_agent -q
tripwire_mutation: Pin grant_invoke aws:SourceArn to this CfnAgent ARN instead of agent/*.
introduced_in: inception
defect_class: latent
disclosure: public
minimization_status: minimized
mitigation: Do not deploy MostPopularRepoBedrockAgentStack alongside other account Bedrock agents, or replace the resource policy with a pinned agent ARN. No live AWS in this environment.
remediation: Pin aws:SourceArn to this CfnAgent's ARN (not agent/*) so only PromptChainDemo-MostPopularRepo can invoke the GitHub actions Lambda.
notes:
    - Classification is public because the defect is in the published aws-samples tree.
    - proof/evidence/adhd-threat-spec-red.md (GitHub trending / agent cluster; account-scoped confused deputy). SourceArn agent/* is not this agent ARN.
customer_impact: Another Bedrock agent in the account can invoke the shared GitHub actions Lambda and use the PAT-backed trending/README tools.
