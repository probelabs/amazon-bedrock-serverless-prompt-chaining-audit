id: KI-github-trending-no-timeout
title: GitHub trending scrapers issue requests.get with no timeout
description: |-
    functions/most_popular_repo_bedrock_agent/github_agent_actions/index.py:16-18 and functions/most_popular_repo_strands/index.py:32-35 call requests.get("https://github.com/trending") with no timeout=. SW-REQ-006 hazard_review applies request_timeout_bounded ("GitHub trending uses requests.get to github.com") — false safety; a hung origin blocks the Lambda until the runtime limit. ADHD shortlist: proof/evidence/adhd-threat-spec-red.md ("GitHub trending GET no timeout; unanchored regex").
    Quote (Bedrock actions):
        get_response = requests.get(
            "https://github.com/trending", headers={"User-Agent": "Mozilla/5.0"}
        )
    Quote (Strands):
        response = requests.get(
            "https://github.com/trending",
            headers={"User-Agent": "Mozilla/5.0"}
        )
affected_requirements:
    - SW-REQ-006
    - SYS-REQ-007
commands:
    - python3 -m pytest --rootdir=/workspace /workspace/tests/test_github_repo.py::test_github_trending_gets_pass_bounded_timeout -q
evidence_manifests:
    - proof/evidence/KI-github-trending-no-timeout.yaml
severity: medium
severity_basis: reproducer
risk: availability
cve_surface: possible
affected_api: get_github_trending_page_agent_action / get_trending_github_repositories (github_agent_actions/index.py:16-18, most_popular_repo_strands/index.py:32-35)
attacker_input: Network stall or slow-loris on https://github.com/trending (or any on-path delay); no attacker body required
sanitizer: manual:missing-timeout
reproducer_command: python3 -m pytest --rootdir=/workspace /workspace/tests/test_github_repo.py::test_github_trending_gets_pass_bounded_timeout -q
tripwire_mutation: Pass timeout= in (1, 30] on both requests.get("https://github.com/trending") calls.
introduced_in: inception
defect_class: latent
disclosure: public
minimization_status: minimized
mitigation: Do not invoke MostPopularRepo agents against a live GitHub trending fetch until both GETs pass timeout= in (1, 30]. No live AWS in this environment.
remediation: Pass timeout= on both trending requests.get calls with a bound in (1, 30] seconds so a hung origin cannot pin the Lambda.
notes:
    - Classification is public because the defect is in the published aws-samples tree.
    - proof/evidence/adhd-threat-spec-red.md cluster "GitHub trending GET no timeout; unanchored regex" (score 6.4); SW-REQ-006 hazard_review request_timeout_bounded is false safety
customer_impact: A hung GitHub trending response can pin the Bedrock-actions or Strands Lambda until the function timeout, stalling the MostPopularRepo workflow.
