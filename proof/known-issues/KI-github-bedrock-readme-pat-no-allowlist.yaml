id: KI-github-bedrock-readme-pat-no-allowlist
title: Bedrock GitHub agent action fetches arbitrary repository READMEs with a shared PAT
description: 'functions/most_popular_repo_bedrock_agent/github_agent_actions/index.py:42-62 (get_github_repository_readme_agent_action) strips only a https://github.com/ prefix and calls Github(auth=Auth.Token(PAT)).get_repo(repo_name).get_readme() with no allowlist binding to the trending-selected public repository. Handler forwards the repo parameter at index.py:81-93. Stack wiring: stacks/most_popular_repo_bedrock_agent_stack.py:48-61. Codex finding-5 (report.md#finding-5).'
affected_requirements:
    - SW-REQ-006
    - SYS-REQ-007
    - INT-REQ-004
commands:
    - python3 -m pytest --rootdir=/workspace /workspace/tests/test_github_repo.py::test_bedrock_readme_rejects_non_allowlisted_repo -q
evidence_manifests:
    - proof/evidence/KI-github-bedrock-readme-pat-no-allowlist.yaml
severity: medium
severity_basis: reproducer
risk: security
cve_surface: possible
affected_api: handler / get_github_repository_readme_agent_action (functions/most_popular_repo_bedrock_agent/github_agent_actions/index.py:42-93)
attacker_input: Bedrock agent tool parameter repo (model/tool-chosen; e.g. https://github.com/evil/private) influenceable via tool-visible content
sanitizer: manual:missing-allowlist
reproducer_command: python3 -m pytest --rootdir=/workspace /workspace/tests/test_github_repo.py::test_bedrock_readme_rejects_non_allowlisted_repo -q
tripwire_mutation: Reject get_github_repository_readme_agent_action / handler repo arguments that are not the trending-selected public URL before Github.get_repo.
reproduction_steps:
    - Read proof/evidence/codex-security-CPeyWd/report.md#finding-5 and functions/most_popular_repo_bedrock_agent/github_agent_actions/index.py:42-62.
    - Run python3 -m pytest --rootdir=/workspace /workspace/tests/test_github_repo.py::test_bedrock_readme_rejects_non_allowlisted_repo -q
    - The Reproduces test mocks Github and calls get_github_repository_readme_agent_action('https://github.com/evil/private'). Correct behavior is reject before get_repo. It fails (xfail) because get_repo is called.
environment_note: No live AWS deployment, Bedrock invocation, or WeasyPrint native runtime in this host. Unit Reproduces tests assert the correct control and xfail while the defect remains.
introduced_in: inception
defect_class: latent
disclosure: public
minimization_status: minimized
mitigation: Use a public-only GitHub PAT; do not grant private-repo scopes. No live AWS or GitHub token in this environment.
remediation: Allowlist README fetches to the single repository URL selected by the trending lookup step; validate strict https://github.com/{owner}/{repo} form; use a least-privilege PAT (public-only) and reject other hosts/paths.
notes:
    - Classification is public because the defect is in the published aws-samples tree.
    - evidence path proof/evidence/codex-security-CPeyWd/report.md#finding-5
customer_impact: A steered agent can read any repository README the shared GitHub PAT can access, including private repos if the token is over-scoped.
