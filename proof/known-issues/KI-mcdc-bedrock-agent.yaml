id: KI-mcdc-bedrock-agent
title: Bedrock agent lookup paths have no unit-level MC/DC witnesses
description: functions/most_popular_repo_bedrock_agent/agent/index.py decisions (retry i>0, repo_match, example URL reject) require Bedrock invoke_agent. No unit harness exists. Native Python MC/DC reports those decisions uncovered.
affected_requirements:
    - SW-REQ-006
severity: medium
severity_basis: risk
risk: correctness
reproducer_command: python3 -m pytest --rootdir=/workspace /workspace/tests/test_bedrock_agent_lookup.py -q
reproduction_steps:
    - Read this KnownIssue description and the named requirement.
    - Confirm the gap with proof audit --check known_issue_complete and the related evidence check.
    - The defect is missing evidence, not a crashing handler; do not encode a passing buggy assertion.
introduced_in: inception
defect_class: latent
minimization_status: not_applicable
mitigation: Mocked unit tests now drive lookup_trending_repo_agent; re-measure MC/DC.
remediation: Add a mocked invoke_agent unit test that drives retry, match, and example-URL rejection, then re-run proof mcdc measure --engine python.
notes:
    - Uncovered agent/index.py decisions; existing github unit tests do not invoke Bedrock.
