id: KI-moviepitch-pitch-glob-1star
title: MoviePitch Choice string_matches 1* selects Red for 10/1foo
description: |-
    stacks/movie_pitch_stack.py:185-188 binds Select Model's Pitch Choice with Condition.string_matches($.model_outputs.response, f'{i+1}*') over temperature_settings Red/Blue/Green. AWS string_matches treats * as a suffix wildcard, so a model completion of "10" or "1foo" selects Red instead of failing closed. The chooser prompt asks for (1)/(2)/(3) at stacks/movie_pitch_stack.py:123-127. ADHD shortlist: proof/evidence/adhd-threat-spec-red.md ("pitch `string_matches 1*` forces Red").
    Quote:
                start_user_choice_fork = start_user_choice_fork.when(
                    sfn.Condition.string_matches("$.model_outputs.response", f"{i+1}*"),
                    pitch_selector.next(user_choice_job),
                )
affected_requirements:
    - SYS-REQ-003
    - SW-REQ-003
commands:
    - python3 -m pytest --rootdir=/workspace /workspace/tests/test_movie_pitch_choice.py::test_movie_pitch_choice_selector_is_exact_digit -q
evidence_manifests:
    - proof/evidence/KI-moviepitch-pitch-glob-1star.yaml
severity: medium
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: movie_pitch_stack.py string_matches (stacks/movie_pitch_stack.py:185-188)
attacker_input: model_outputs.response after Choose Best Movie Pitch (e.g. completion 10 or 1foo matching 1*)
sanitizer: manual:choice-glob
reproducer_command: python3 -m pytest --rootdir=/workspace /workspace/tests/test_movie_pitch_choice.py::test_movie_pitch_choice_selector_is_exact_digit -q
tripwire_mutation: "Replace Condition.string_matches f'{i+1}*' with exact-digit string_equals {1,2,3}."
introduced_in: inception
defect_class: latent
disclosure: public
minimization_status: minimized
mitigation: Treat model pitch indexes other than the exact digits 1/2/3 as Fail; do not ship a workflow that glob-matches the first character. No live AWS in this environment.
remediation: Replace string_matches f'{i+1}*' with an exact-digit / enum {1,2,3} selector (string_equals or a non-wildcard match) so 10/1foo do not select Red.
notes:
    - Classification is public because the defect is in the published aws-samples tree.
    - proof/evidence/adhd-threat-spec-red.md cluster "pitch `string_matches 1*` forces Red" (score 7.0)
customer_impact: The human gate can present the Red pitch when the model meant a different index or emitted extra characters, so the producer yes/no decision is on the wrong movie idea.
