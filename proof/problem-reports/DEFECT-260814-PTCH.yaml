schema_version: 1
id: DEFECT-260814-PTCH
title: MoviePitch Choice string_matches N* selects a pitch for 10/1foo
description: |
  stacks/movie_pitch_stack.py binds Select Model's Pitch Choice with
  Condition.string_matches($.model_outputs.response, f'{i+1}*') over
  temperature_settings Red/Blue/Green. AWS string_matches treats * as a suffix
  wildcard, so a model completion of "10" or "1foo" selects Red instead of
  failing closed. The chooser prompt asks for (1)/(2)/(3).
  Introduced at 0a837eb when the movie pitch demo moved to native Bedrock and
  the Lambda chooser was replaced by this Choice. Never correct — not a
  regression. 3d4f547 later fixed a related wiring bug (pitches not inserted
  into the chooser) but left the glob selector.
  Live failure mode: KI-moviepitch-pitch-glob-1star.
introduced_in: 0a837eb9c84d8c13bbbe7ea1ac234b7bc99c3331
source:
    type: audit_finding
    repo: amazon-bedrock-serverless-prompt-chaining
    commit: 0a837eb9c84d8c13bbbe7ea1ac234b7bc99c3331
    reference: proof/known-issues/KI-moviepitch-pitch-glob-1star.yaml
    date: "2026-08-14"
classification:
    surface: runtime_code
    defect_class: glob_choice
    severity: medium
    security_relevant: false
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: |
      SYS-REQ-003 / SW-REQ-003 now state pitch_choice in 1-3 (range) and the
      rationale names the glob. The original native-Bedrock migration shipped
      without a test that "10" and "1foo" fail closed. Range is the wrong
      absorber — the intended contract is enum {1,2,3} exact, not 1 <= n <= 3
      with a prefix wildcard. MealPlanner already uses string_equals (sibling
      port check: no second glob).
