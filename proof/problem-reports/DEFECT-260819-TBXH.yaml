            - tests/test_github_repo.py
        evidence_profiles:
            - proof/evidence/KI-github-bedrock-readme-pat-no-allowlist.yaml
        obligation_evidence:
            - requirement: SW-REQ-006
              obligation_class: confused_deputy_prevented
              evidence_type: test
    rationale: |
      This DEFECT closes KI-github-bedrock-readme-pat-no-allowlist (status=fixed,
      evidence observed_result=defect_fixed). The Bedrock README tool now
      enforces GITHUB_ALLOWED_REPO_URLS (fail-closed) plus a strict
      https://github.com/{owner}/{repo} fullmatch before PAT load /
      Github.get_repo (commit f70a4e1). SW-REQ-006 was strengthened:
      confused_deputy_prevented is attached and no longer suppressed. The KI's
      Reproduces tests (test_bedrock_readme_rejects_non_allowlisted_repo,
      test_bedrock_readme_rejects_non_full_github_url) now pass without xfail.

      disposition.known_issues lists the OTHER still-open KIs that share
      SW-REQ-006 so this closure does not mask them. The closed KI is linked
      from source.reference and impact_analysis.affected_evidence; it is not
      repeated under known_issues because it is no longer active.
    reviewer: agent:grok
    reviewed_at: "2026-08-26T12:00:00Z"
