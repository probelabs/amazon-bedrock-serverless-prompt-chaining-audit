    missing_test_partition: true
    missing_mcdc_variable: false
    notes: |
      The PAT-allowlist property was unclaimed on SW-REQ-006 (confused_deputy_prevented
      was suppressed). No test asserted rejection of a non-allowlisted repo before
      Github.get_repo. The failure mode was pinned only by the audit tripwire on
      KI-github-bedrock-readme-pat-no-allowlist.
