schema_version: 1
id: DEFECT-260814-STAR
title: Pipeline Deploy CodeBuild roles grant Action=* Resource=*
description: |
  pipeline/pipeline_stack.py attaches iam.PolicyStatement(actions=["*"],
  resources=["*"]) to both DeployExamples (lines 167-169) and DeployDemoApp
  (lines 286-288). Each project runs cdk deploy --all --require-approval=never.
  A compromised pipeline source or CodeBuild execution is account-admin equivalent.
  Introduced at 6fad924 on the original Deploy project. a71c85a cloned the same
  star-star grant onto DeployTechniqueExamples (later DeployExamples). The class
  was never correct — not a regression.
  Live failure modes: KI-pipeline-deploy-demo-star-star and
  KI-pipeline-deploy-examples-star-star.
introduced_in: 6fad9246642a22f315d10a09f1f970826de0687d
