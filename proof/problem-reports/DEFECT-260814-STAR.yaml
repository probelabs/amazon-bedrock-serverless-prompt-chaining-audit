    severity: high
    security_relevant: true
root_cause:
    missing_requirement: true
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: |
      SYS-REQ-006 models the technique catalog counts, not deploy-role least
      privilege. No data_constraint forbids Action=* Resource=* on CodeBuild
      deploy principals. The original pipeline tests asserted stack shape, not
      the IAM statement. Codex findings 1 and 2 made the class visible. Sibling
      IAM wildcard: KI-bedrock-agent-invoke-wildcard (agent/* SourceArn).
