schema_version: 1
id: DEFECT-260814-MD2P
title: Trip planner PDF path evaluates untrusted markdown as Jinja2 (SSTI)
description: |
  functions/trip_planner/pdf_creator/index.py interpolates event["location"] and
  event["itinerary"] into a markdown f-string and passes it to md2pdf(..., raw=).
  md2pdf always runs unsandboxed jinja2.Template(raw).render(). An authenticated
  demo user can inject {{7*7}} (or worse) via the Trip Planner location field and
  achieve code execution inside the PDF Lambda.
  First written at 92f2d3d (agents/trip_planner/pdf_creator, md_content=).
  08848a5 switched the call to raw= to follow an md2pdf API break; that is the
  current Jinja path. The class is untrusted interpolation into the renderer,
  present since first write — not a previously-correct regression.
  Live failure mode: KI-pdf-md2pdf-ssti. Sibling renderer class: KI-pdf-weasyprint-ssrf.
introduced_in: 92f2d3d53ac473af78ab8fc551cea77fa6342682
source:
    type: audit_finding
    repo: amazon-bedrock-serverless-prompt-chaining
    commit: 08848a57ff5166632edfb43ad1a7578709056d9e
    reference: proof/known-issues/KI-pdf-md2pdf-ssti.yaml
    date: "2026-08-13"
classification:
    surface: security_behavior
    defect_class: untrusted_renderer
    severity: high
    security_relevant: true
root_cause:
    missing_requirement: true
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: |
      SW-REQ-007 / SYS-REQ-008 / INT-REQ-006 specify upload, ContentType, unlink,
      and expires_in 60-900. They do not constrain the renderer to data-only
      (no Jinja, no URL fetch). The original product tests never asserted that
      location/itinerary stay uninterpreted. Codex finding-3 plus the library
      probe (builtins_open_exposed: True) made the class visible.
